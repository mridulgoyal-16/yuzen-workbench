<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yulu · Workbench flow</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap">
<style>
/* ============================================================
   CORE TOKENS  —  yulu-design-system / tokens/color-variables.md
   ============================================================ */
:root{
  --color-white:#FFFFFF;
  --color-grey-100:#F7F7F7;
  --color-grey-200:#E8E8E8;
  --color-grey-300:#DDDDDD;
  --color-grey-400:#B0B0B0;
  --color-grey-500:#919191;
  --color-grey-600:#717171;
  --color-grey-900:#222222;
  --color-black:#000000;
  --color-green-500:#00654F;
  --color-orange-500:#E07912;
  --color-red-500:#C13515;
  --color-yulu-blue-500:#30CDFD;

  /* Semantic — content */
  --content-primary:var(--color-grey-900);
  --content-secondary:var(--color-grey-600);
  --content-tertiary:var(--color-grey-500);
  --content-disabled:var(--color-grey-400);
  --content-inverse:var(--color-white);
  --content-positive:var(--color-green-500);

  /* Semantic — surface */
  --surface-primary:var(--color-grey-900);
  --surface-secondary:var(--color-grey-100);
  --surface-disabled:var(--color-grey-300);
  --surface-inverse:var(--color-white);

  /* Semantic — border */
  --border-primary:var(--color-grey-200);
  --border-secondary:var(--color-grey-400);
  --border-selected:var(--color-grey-900);

  /* Semantic — canvas */
  --canvas-primary:var(--color-white);
  --canvas-inverse:var(--color-grey-900);

  /* Spacing scale (tokens/spacing.md) */
  --spacing-1:4px;  --spacing-2:8px;   --spacing-4:16px; --spacing-6:24px;
  --spacing-9:36px; --spacing-12:48px; --spacing-16:64px;

  /* Type */
  --font:"Satoshi","Satoshi Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;

  /* Prototype-only */
  --screen-radius:36px;                /* the phone's own corners */
  --sheet-radius:36px;                 /* sheet + expanded page, top corners */
  --ease:cubic-bezier(.32,.72,0,1);
  --morph:.34s;                        /* pill → search field */
}

/* Typography roles — tokens/typography.md */
.t-heading-small { font-size:20px; line-height:28px; font-weight:700; }
.t-label-md700   { font-size:16px; line-height:20px; font-weight:700; }
.t-label-md      { font-size:16px; line-height:20px; font-weight:500; }
.t-label-sm      { font-size:14px; line-height:16px; font-weight:500; }
.t-label-xs      { font-size:12px; line-height:16px; font-weight:500; }
.t-body-md       { font-size:16px; line-height:24px; font-weight:500; }
.t-body-sm       { font-size:14px; line-height:20px; font-weight:500; }

/* ============================================================
   STAGE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html{ height:100%; }
body{
  margin:0; min-height:100%;
  font-family:var(--font);
  background:var(--canvas-primary);
  color:var(--content-primary);
  display:flex; align-items:center; justify-content:center;
  -webkit-font-smoothing:antialiased;
}
/* The screen is a fixed 390×844 that scales to whatever the window allows.
   On a phone it runs edge to edge — no padding, no case — so every pixel goes
   to the UI, with a hairline stroke to mark where the screen ends. On a desktop
   there's room to spare, so the phone case comes back.
   --scale is set by fitDevice() on resize. */
:root{ --scale:1; }
.frame{
  position:relative; flex:none;
  width:calc(390px * var(--scale));
  height:calc(844px * var(--scale));
  /* On .frame rather than .device: this box isn't scaled, so 2px stays 2px.
     The radius has to be scaled by hand for the same reason — the outline
     follows it, and it must trace the screen's own scaled corner exactly. */
  outline:2px solid var(--color-black);
  border-radius:calc(var(--screen-radius) * var(--scale));
}
.device{
  position:absolute; top:0; left:0;
  transform:scale(var(--scale));
  transform-origin:top left;
  width:390px; height:844px;
  background:var(--canvas-primary);
  border-radius:var(--screen-radius);
  overflow:hidden;
  isolation:isolate;
  touch-action:none;
  user-select:none;
}

/* Desktop: the window is wider than the phone needs, so spend the spare room
   on the case instead of leaving the screen floating in white. */
@media (min-width:800px){
  body{ background:#EDEDEF; }
  .frame{ outline:none; }
  .device{
    box-shadow:0 0 0 10px #1b1b1e, 0 24px 60px rgba(0,0,0,.28);
  }
}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.icon-mask{
  display:block;
  background-color:currentColor;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:center;  mask-position:center;
  -webkit-mask-size:contain;     mask-size:contain;
}

/* Status bar (iPhone-status-bar(upper) — 390×44) */
.statusbar{
  height:44px; flex:none;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 22px 0 27px;
  font-size:15px; font-weight:700; letter-spacing:-.02em;
}
.statusbar .glyphs{ display:flex; align-items:center; gap:6px; }

/* Top App Bar — components/top-app-bar (72px, title Label/Medium700) */
.appbar{
  height:72px; flex:none;
  display:flex; align-items:center; justify-content:center;
  padding:10px 4px; position:relative;
  background:var(--surface-inverse);
}
.appbar__title{ font-size:16px; line-height:20px; font-weight:700; color:var(--content-primary); max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* label/medium600 — Satoshi Bold, 16/20, letter-spacing 0. The "600" is the
   token's name, not a CSS weight: Satoshi has no semibold, and the role maps
   to the Bold cut. Spelled out rather than left to inherit, because this title
   is specified in its own right and has been respecified more than once.
   Carried by the search screen too, so the header doesn't shift between them. */
.appbar__title--workbench{ font-weight:700; letter-spacing:0; }
.appbar__action{
  position:absolute; top:50%; transform:translateY(-50%);
  width:48px; height:48px; border:0; background:none; padding:0;
  display:grid; place-items:center; cursor:pointer; color:var(--content-primary);
}
.appbar__action--trailing{ right:4px; }

/* Trailing "Done" — text plus tick, per the edit-mode spec. Absolutely placed
   like the kebab it replaces, so swapping them never reflows the centred title. */
.appbar__done{
  position:absolute; top:50%; right:var(--spacing-6); transform:translateY(-50%);
  border:0; background:none; padding:0; cursor:pointer;
  display:flex; align-items:center; gap:var(--spacing-2);
  font-family:var(--font); font-size:16px; line-height:20px; font-weight:500;
  color:var(--content-primary);
}
/* In edit mode the title steps back and Done becomes the action. */
.appbar.is-editing .appbar__title{ color:var(--content-secondary); }
/* Pinned only while editing: Done has to stay reachable however far you have
   scrolled. Out of edit mode the title scrolls away with the content. */
.appbar.is-editing{
  position:sticky; top:0; z-index:7;
  background:var(--canvas-primary);
}

/* Kebab menu. One item today; the shape is there for more. */
.menu-scrim{
  position:absolute; inset:0; z-index:55;
  background:rgba(0,0,0,.30);
}
.menu{
  position:absolute; z-index:56;
  min-width:180px; padding:var(--spacing-2) 0;
  background:var(--surface-inverse);
  border:1px solid var(--border-primary); border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.14), 0 1px 4px rgba(0,0,0,.06);
}
.menu__item{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  border:0; background:none; cursor:pointer;
  padding:12px var(--spacing-4);
  font-family:var(--font); font-size:16px; line-height:20px; font-weight:500;
  color:var(--content-primary);
}
.menu__item:active{ background:var(--surface-secondary); }


/* Icon button (round action tile) */
.iconbtn{
  border:0; padding:0; cursor:pointer;
  border-radius:999px;
  background:var(--surface-secondary);
  color:var(--content-primary);
  display:grid; place-items:center;
  transition:transform .12s var(--ease), background .12s linear;
}
.iconbtn:active{ transform:scale(.93); background:var(--color-grey-200); }

/* Divider — components/divider (1px, border/primary) */
.divider{ height:1px; background:var(--border-primary); flex:none; }

/* ============================================================
   ACTION GRID  (3 columns, cells hug, 8px gutters)
   ============================================================ */
/* One grid everywhere — sheet and full page share identical metrics so the
   expand animation doesn't re-lay-out its contents mid-motion.
   90px tiles evenly distributed (36px gutters), 36px rows, 48px icons. */
.grid{
  /* Its own stacking context, so the tiles' position:relative icons stay
     confined below the sticky strip instead of joining the positioned layer
     alongside it. */
  position:relative; z-index:0;
  display:grid;
  padding:0 var(--spacing-6);                    /* 342px content area */
  grid-template-columns:repeat(3,90px);
  justify-content:space-between;
  row-gap:var(--spacing-9);
}

.tile{
  border:0; background:none; padding:0; cursor:pointer;
  display:flex; flex-direction:column; align-items:center;
  gap:var(--spacing-4);
  color:var(--content-primary);
}
/* 54px slot. A 3D icon fills it outright — no circle behind. Actions with no
   art yet keep the 48px placeholder circle, centred in the same slot so rows
   stay level when a grid mixes the two. */
.tile__icon{
  position:relative; flex:none;
  width:54px; height:54px;
  display:grid; place-items:center;
  transition:transform .12s var(--ease);
}
.tile__art{ width:54px; height:54px; display:block; object-fit:contain; }
.tile__ph{
  width:48px; height:48px; border-radius:999px;
  background:var(--surface-secondary);
  display:grid; place-items:center;
  transition:background .12s linear;
}
.tile__icon .icon-mask{ width:24px; height:24px; }
.tile:active .tile__icon{ transform:scale(.93); }
.tile:active .tile__ph{ background:var(--color-grey-200); }

/* ---- Edit mode: iOS-style wiggle + add/remove badges ---- */
.tile__badge{
  position:absolute; top:-2px; right:-2px;
  width:22px; height:22px; border-radius:999px;
  /* Grey500 direct — the DS has no semantic surface token for this fill. */
  background:var(--color-grey-500); color:var(--content-inverse);
  display:grid; place-items:center;
}
/* Empty favourite slot — pads a partial row out to 3 and doubles as the way
   into edit mode. Top-aligned so it lines up with the icons beside it. */
.slot{
  position:relative;
  width:90px; height:90px; align-self:start;
  padding:0; cursor:pointer;
  border:0; border-radius:16px; background:none;
  color:var(--content-disabled);
  display:grid; place-items:center;
  transition:color .12s linear;
}
/* Drawn rather than `border:dashed`, which gives no control over dash length.
   stroke-dasharray "8 8" = 8px dash, 8px gap. */
.slot__frame{
  position:absolute; inset:0;
  color:var(--border-primary);
  transition:color .12s linear;
}
.slot:active{ color:var(--content-secondary); }
.slot:active .slot__frame{ color:var(--border-secondary); }

@keyframes tile-wiggle-a{ 0%,100%{ transform:rotate(-1.1deg); } 50%{ transform:rotate(1.1deg); } }
@keyframes tile-wiggle-b{ 0%,100%{ transform:rotate(1.1deg); } 50%{ transform:rotate(-1.1deg); } }
.grid.is-editing .tile{ animation:tile-wiggle-a .27s ease-in-out infinite; }
.grid.is-editing .tile:nth-child(even){ animation-name:tile-wiggle-b; animation-duration:.31s; }
.grid.is-editing .tile:nth-child(3n){ animation-duration:.29s; }
@media (prefers-reduced-motion:reduce){
  .grid.is-editing .tile{ animation:none; }
}
/* Sentence case is applied in JS, not here: ::first-letter doesn't apply to
   the -webkit-box below, and iOS Safari renders every label lowercase without
   it. See display() in the script. */
.tile__label{
  font-size:12px; line-height:16px; font-weight:500;
  color:var(--content-primary); text-align:center;
  height:32px; width:100%;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
}

/* ============================================================
   TABS — components/tabs (56px, 16px pad, 2px indicator)
   ============================================================ */
/* D2 — chips instead of underlined tabs. 48px tall, 16px of padding inside,
   12px between them, 24px from the screen edge. Every chip carries its 24px
   icon; selected fills with content/primary, unselected is white inside a
   border/primary hairline. Four chips with icons overflow 390px, so the strip
   scrolls and selecting one brings it into view. */
.tabs{
  flex:none;
  display:flex; align-items:center; gap:12px;
  /* 12px each side: with the 24px spacer above and the grid's 12px below, that
     puts 36px between the favourites and the chips, and 24px between the chips
     and the actions. Splitting it this way rather than loading it all onto the
     grid keeps a 12px margin under the chips while the strip is pinned —
     otherwise scrolling content is clipped flush against the chip edge. */
  padding:12px var(--spacing-6);
  overflow-x:auto; overflow-y:hidden;
  scrollbar-width:none;
  /* No rule under the chips — they carry their own edges. The strip is opaque,
     so content still scrolls cleanly beneath it while it's pinned. */
  background:var(--canvas-primary);
}
.tabs::-webkit-scrollbar{ display:none; }
.tab{
  flex:none; cursor:pointer; white-space:nowrap;
  height:48px; padding:0 var(--spacing-4);
  border:1px solid var(--border-primary);
  background:var(--surface-inverse);
  border-radius:999px;
  display:flex; align-items:center; gap:var(--spacing-2);
  font-family:var(--font); font-size:16px; line-height:20px; font-weight:500;
  color:var(--content-primary);
  transition:background-color .15s var(--ease), border-color .15s var(--ease),
             color .15s var(--ease);
}
.tab__icon{ width:24px; height:24px; flex:none; object-fit:contain; }
.tab[aria-selected="true"]{
  background:var(--content-primary);
  border-color:var(--content-primary);
  color:var(--content-inverse);
}

/* ============================================================
   FLOATING SEARCH  (persistent, sits above the bottom nav)
   ============================================================ */
.searchfab{
  position:absolute; left:0; right:0; bottom:100px; height:80px;
  z-index:40;
  display:grid; place-items:center;
  pointer-events:none;
  transition:opacity .22s var(--ease), transform .28s var(--ease);
}
/* The scrim lives on a pseudo-element so it can fade. Gradients don't
   interpolate to `none`, but opacity does.
   Light touch: it only has to keep a tile from colliding with the pill, not
   erase it. The old ramp hit 86% opaque by 42% of the band, which read as a
   solid white slab over whatever was scrolling underneath. */
.searchfab::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(255,255,255,0)   0%,
    rgba(255,255,255,.28) 40%,
    rgba(255,255,255,.66) 70%,
    var(--canvas-primary) 100%);
  transition:opacity .2s linear;
}
/* Landed: scrolled to the end of the page, where there is nothing behind the
   pill. The scrim has nothing to fade out and the lift has nothing to lift off,
   so both come away and the pill reads as sitting on the bottom of the page.
   Revert to the always-floating treatment by deleting these two rules. */
.searchfab.is-landed::before{ opacity:0; }
.searchfab.is-landed .searchfab__btn{ box-shadow:0 1px 3px rgba(0,0,0,.05); }
.searchfab__btn{
  pointer-events:auto;
  /* Above the scrim. The scrim is an absolutely-positioned ::before, and
     positioned boxes paint over static ones — without this it washes over the
     pill it is supposed to be clearing space for. */
  position:relative; z-index:1;
  height:48px; min-width:48px; padding:0 var(--spacing-6) 0 20px;
  border-radius:100px;
  border:1px solid var(--border-primary);
  background:var(--surface-inverse);
  color:var(--content-primary);
  font-family:var(--font); font-size:16px; line-height:20px; font-weight:500;
  display:inline-flex; align-items:center; gap:var(--spacing-2);
  cursor:pointer;
  /* 5 + 18 = 23px of reach below the pill. Inside the collapsed sheet only 24px
     of padding sits under it before `overflow:hidden` clips, so this is as far
     as the shadow can go without losing its tail there. */
  box-shadow:0 5px 18px rgba(0,0,0,.15), 0 1px 4px rgba(0,0,0,.06);
  transition:transform .12s var(--ease), box-shadow .2s linear;
}
.searchfab__btn:active{ transform:scale(.96); }
/* Inside the collapsed sheet the pill isn't a floating layer — it's the last
   row of the sheet's own content, 24px under the favourites. No absolute
   placement, and no gradient scrim: there's nothing to fade out over. */
.sheet > .searchfab{
  position:static; flex:none;
  height:auto; padding-top:var(--spacing-6);
  background:none;
}
/* No scrim in the sheet — and the pseudo-element would anchor to the sheet
   rather than the band, since the band isn't positioned here. */
.sheet > .searchfab::before{ content:none; }

/* ============================================================
   BOTTOM NAV  (100px: 16px top pad + 44px items)
   ============================================================ */
.bottomnav{
  position:absolute; left:0; right:0; bottom:0; height:100px;
  z-index:50;
  background:var(--surface-inverse);
  border-top:1px solid var(--border-primary);
  padding:var(--spacing-4) var(--spacing-6) 0;
  display:flex; align-items:flex-start;
}
.navitem{
  flex:1; border:0; background:none; cursor:pointer; padding:0;
  height:44px; display:flex; flex-direction:column; align-items:center; gap:var(--spacing-1);
  font-family:var(--font); font-size:12px; line-height:16px; font-weight:500;
  color:var(--content-tertiary);              /* unselected nav — per design call */
}
.navitem .icon-mask{ width:24px; height:24px; }
.navitem[aria-current="page"]{ color:var(--content-primary); font-weight:700; }

/* ============================================================
   LAYERS
   ============================================================ */
.layer{ position:absolute; inset:0; display:flex; flex-direction:column; background:var(--canvas-primary); }

/* ---- Base: Tasks screen (static image; coded version is the fallback) ---- */
.tasks-img{
  position:absolute; left:0; right:0; top:0; bottom:100px;
  width:100%; height:calc(100% - 100px);
  object-fit:cover; object-position:top center;
  display:block;
}
.tasks__tabs{ padding-top:var(--spacing-6); }
.tasklist{ flex:1; overflow:hidden; }
.taskrow{ height:72px; padding:0 var(--spacing-6); display:flex; align-items:center; justify-content:space-between; }
.taskrow__name{ font-size:16px; line-height:20px; font-weight:500; }
.taskrow__batt{ display:flex; align-items:center; gap:var(--spacing-1); font-size:16px; line-height:20px; font-weight:500; color:var(--content-secondary); }
.taskrow__batt .icon{ width:20px; height:20px; color:var(--content-secondary); }
.tasklist .divider{ margin:0 var(--spacing-6); }

/* ---- Scrim — components/overlay ---- */
.scrim{
  position:absolute; inset:0; z-index:20;
  background:rgba(0,0,0,.24);
  opacity:0; pointer-events:none;
  transition:opacity .3s var(--ease);
}
.scrim.is-on{ opacity:1; pointer-events:auto; }

/* ---- Bottom sheet (screen 1) ---- */
/* The sheet is sized by its content, not pinned to a fixed top: five
   favourites make a shorter sheet than nine, and an empty row never leaves
   dead space. It's anchored to the bottom edge and grows upward, capped so it
   can never climb past the point where expanding to full screen takes over. */
/* Bottom edge sits on the nav's top edge, not on the screen's — the nav is
   fixed furniture at the physical bottom, and the sheet is a panel that opens
   above it. Running the sheet's white surface underneath the nav made the
   collapsed screen read as two screens stacked. */
.sheet{
  position:absolute; left:0; right:0; bottom:100px;
  /* Sized by its content, capped so a strip of the Tasks screen always shows:
     nine favourites — the most possible — come to exactly 618px. */
  height:auto; max-height:618px;
  padding-bottom:var(--spacing-6);
  z-index:30;
  background:var(--canvas-primary);
  border-radius:var(--sheet-radius) var(--sheet-radius) 0 0;
  box-shadow:0 -8px 32px rgba(0,0,0,.10);
  transform:translateY(100%);
  transition:transform .38s var(--ease);
  display:flex; flex-direction:column;
  overflow:hidden;
}
/* Nothing in the sheet may shrink. Without this, a column flex container that
   hits its cap silently squashes whichever children can give — at nine
   favourites the section heading collapsed from 48px to 32px. */
.sheet > *{ flex:none; }
.sheet.is-open{ transform:translateY(0); }
.sheet.is-dragging{ transition:none; }
/* 36px above the chevron. Below it, 22px + the 14px the section header already
   puts above its own text — its 20px line centred in a 48px box — makes the
   specified 36px from the arrow down to "Favourites". */
.sheet__grab{
  flex:none;
  display:flex; align-items:flex-start; justify-content:center;
  padding:36px 0 22px;
  cursor:grab;
  touch-action:none;
}
.sheet__grab:active{ cursor:grabbing; }
.sheet__expand{
  position:relative;
  width:24px; height:14px; border:0; padding:0;
  background:none;
  color:var(--content-disabled);
  display:grid; place-items:center;
  cursor:pointer;
  transition:color .12s var(--ease), transform .12s var(--ease);
}
/* 52 × 44 hit target around a 24 × 14 glyph — the arrow is too small to aim
   at, and the padding around it is dead space otherwise. */
.sheet__expand::after{
  content:""; position:absolute; left:-14px; right:-14px; top:-15px; bottom:-15px;
}
.sheet__expand:active{
  color:var(--content-tertiary);
  transform:translateY(-1px);
}

/* ---- Expanded page (screen 3) ---- */
.page{
  position:absolute; inset:0; z-index:35;
  background:var(--canvas-primary);
  display:flex; flex-direction:column;
  opacity:0; pointer-events:none;
  transform:translateY(16px);
  transition:opacity .26s var(--ease), transform .3s var(--ease);
}
.page.is-on{ opacity:1; pointer-events:auto; transform:none; }

/* The expanded workbench is the SHEET growing, not a new page. It starts life
   at the sheet's exact geometry (--sheet-top, measured after the favourites
   render, and a 24px top radius) and stretches to full screen, while the sheet
   stays put underneath so the white surface and corner radius stay continuous
   through the whole move. */
#pageExpanded{
  top:var(--sheet-top, 176px); border-radius:var(--sheet-radius) var(--sheet-radius) 0 0;
  overflow:hidden; transform:none;
  transition:opacity .2s var(--ease),
             top .42s var(--ease),
             border-radius .42s var(--ease);
}
#pageExpanded.is-on{ top:0; border-radius:0; }

/* Opaque, and above the scroll: the page title scrolls away underneath it, and
   tiles carry position:relative icons that otherwise bleed into this band. */
.page__head{ flex:none; position:relative; z-index:6; background:var(--canvas-primary); }
.page__scroll{
  flex:1; overflow-y:auto; overscroll-behavior:contain;
  padding-bottom:180px;                 /* clears floating search + nav */
  touch-action:pan-y;
}
.page__scroll::-webkit-scrollbar{ display:none; }
.page__scroll{ scrollbar-width:none; }

/* Section header — components/section-header (24px pad, Headings/Small) */
.sectionhead{
  height:48px; padding:0 var(--spacing-6) 0 var(--spacing-6);
  display:flex; align-items:center; justify-content:space-between;
}
/* No padding: the 48 × 48 icon artboards carry their own 12px inset, which is
   what used to be padding here. Keeps the ink 24px in from the screen edge. */
.sectionhead__action{
  width:48px; height:48px; margin-right:-12px;
  border:0; background:none; padding:0; cursor:pointer;
  display:grid; place-items:center; color:var(--content-primary); border-radius:999px;
}
.sectionhead__action:active{ background:var(--surface-secondary); }
/* Scroll cue — the tab row overflows by ~48px, so fade the trailing edge to
   signal there's more. Fades out once you've scrolled to the end. */
.tabs-wrap{ position:relative; background:var(--canvas-primary); }
.tabs-wrap::after{
  content:""; position:absolute; right:0; top:0; bottom:0; width:48px;
  pointer-events:none;
  background:linear-gradient(to right, rgba(255,255,255,0) 0%, var(--canvas-primary) 78%);
  opacity:1; transition:opacity .2s linear;
}
.tabs-wrap.at-end::after{ opacity:0; }
.tabs--sticky{ position:sticky; top:0; z-index:5; }

/* Expanded-page vertical rhythm */
.gap-head{ padding-top:var(--spacing-6); }          /* heading → content: 24px */
.gap-chips{ padding-top:12px; }                     /* + the strip's 12px = 24px */
/* Workbench title → favourites. The 72px app bar already leaves 26px under the
   title text, so the grid adds the remaining 10 to make 36. */
.gap-title{ padding-top:10px; }
.gap-actions-tabs{ height:var(--spacing-6); }       /* + the strip's 12px = 36px */

/* ---- Search page (screen 2) ---- */
/* No padding of its own: "Recommended" has to start exactly where "Favourites"
   sits on the expanded page, or the tiles jump when search takes over. */
.search__results{ flex:1; overflow-y:auto; }
.search__results::-webkit-scrollbar{ display:none; }
.search__results{ scrollbar-width:none; }
/* Deliberately the same box as .sectionhead — 48px tall, same padding, same
   label/medium type. "Recommended" lands exactly where "Favourites" was, so
   the tiles underneath don't jump when the search page takes over. */
.search__label{
  height:48px; padding:0 var(--spacing-6);
  display:flex; align-items:center;
  /* content/primary, matching "Favourites" — the two are the same kind of
     label in the same slot. Carries both states of this element: the
     "Recommended" prompt and the "N results" count. */
  font-size:16px; line-height:20px; font-weight:500; color:var(--content-primary);
}
.search__empty{
  padding:var(--spacing-12) var(--spacing-6); text-align:center;
  font-size:16px; line-height:24px; font-weight:500; color:var(--content-secondary);
}
/* The bar positions its children absolutely so the field can be morphed
   from the floating Search pill's geometry without fighting flex layout. */
.search__bar{
  flex:none; position:relative; height:88px;
  background:var(--canvas-primary);
}
.search__field{
  position:absolute; left:24px; top:16px; width:288px; height:56px;
  padding:0 16px 0 20px;
  border:1px solid var(--content-primary); border-radius:100px;
  display:flex; align-items:center; gap:12px;
  background:var(--surface-inverse);
  transition:left var(--morph) var(--ease),
             top var(--morph) var(--ease),
             width var(--morph) var(--ease),
             height var(--morph) var(--ease),
             border-color var(--morph) linear;
}
/* Clear-the-query button, inside the field. Only while there's a query. */
.search__clear{
  width:24px; height:24px; flex:none; padding:0;
  border:0; background:none;
  display:none; cursor:pointer;
}
.search__clear.is-on{ display:block; }
.search__clear img{ display:block; width:100%; height:100%; }
.search__clear:active{ opacity:.6; }
/* Same content/primary as the floating pill's icon. The pill morphs into this
   field, so a magnifier that changed shade mid-flight reads as two icons. */
.search__field .icon{ width:20px; height:20px; color:var(--content-primary); flex:none; }
.search__input{
  flex:1; min-width:0; border:0; outline:0; background:none; padding:0;
  font-family:var(--font); font-size:16px; line-height:24px; font-weight:500;
  color:var(--content-primary); caret-color:var(--content-primary);
}
.search__input::placeholder{ color:var(--content-disabled); }
/* Cancel — no background. Exception to the spacing scale: vertical padding
   stays 16px so the tap target survives losing the filled circle. */
.search__close{
  position:absolute; right:16px; top:50%; margin-top:-27px;
  border:0; background:none;
  padding:16px 8px;
  color:var(--content-primary);
  display:grid; place-items:center; cursor:pointer;
}
.search__close:active{ opacity:.5; }
.search__results{ min-height:0; }

/* ============================================================
   iOS KEYBOARD
   ============================================================ */
/* Search page: no slide or fade of its own — the field morph carries the
   motion. The page flips opaque instantly so the field is never translucent;
   its BACKGROUND and CONTENTS are what dissolve in and out around it. */
/* Above the bottom nav (z 50), not below it. The nav is never unmounted now —
   the keyboard simply covers it, and uncovers it on the way out. Hiding the nav
   and restoring it at the end of the close left an empty band at the bottom of
   the screen for the whole time the keyboard was sliding away. */
#pageSearch{ z-index:60; transform:none; transition:background-color .2s linear; }
#pageSearch .page__head,
#pageSearch .search__results,
#pageSearch .search__close{ transition:opacity .2s linear; }
#pageSearch .search__bar{ transition:background-color .2s linear; }

#pageSearch.is-opening,
#pageSearch.is-opening .search__bar{ background:transparent; }
#pageSearch.is-opening .page__head,
#pageSearch.is-opening .search__results,
#pageSearch.is-opening .search__close{ opacity:0; }
#pageSearch.is-opening .search__field{ border-color:var(--border-primary); }
#pageSearch .kb{ transform:translateY(100%); transition:transform var(--morph) var(--ease); }
#pageSearch.is-on:not(.is-closing) .kb{ transform:none; }
/* Closing: everything EXCEPT the field dissolves, so the field stays the one
   continuous surface travelling back down onto the pill. The page's own white
   background goes too — otherwise it would pop off at the end and reveal the
   sheet underneath all at once. */
#pageSearch.is-closing{ background:transparent; transition:background-color .22s linear; }
#pageSearch.is-closing .search__bar{ background:transparent; }
#pageSearch.is-closing .search__field{ border-color:var(--border-primary); }
#pageSearch.is-closing .page__head,
#pageSearch.is-closing .search__results,
#pageSearch.is-closing .search__close{ opacity:0; transition:opacity .16s linear; }

/* Layout-animating the field is the expensive part of the morph — hint it. */
.search__field.is-morphing{ will-change:left, top, width, height; }

.kb{
  flex:0 0 auto;
  background:#D1D3D9;
  padding-bottom:25px;                 /* home-indicator gutter */
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  user-select:none;
}
.kb__accessory{
  height:38px; background:#F2F2F7;
  border-bottom:1px solid rgba(0,0,0,.14);

}
.kb__nudge{ display:flex; align-items:center; gap:22px; color:#B3B6BD; }
.kb__nudge button{ border:0; background:none; padding:0; color:inherit; cursor:default; display:grid; place-items:center; }
.kb__done{
  border:0; background:none; padding:0; cursor:pointer;
  font:700 17px/1 inherit; color:#33384B; letter-spacing:.01em;
}
.kb__done:active{ opacity:.5; }

.kb__suggest{
  height:40px; display:flex; align-items:stretch;
  font-size:15px; color:#000;
}
.kb__suggest span{
  flex:1; display:grid; place-items:center;
  border-right:1px solid #B6B9C0;
}
.kb__suggest span:last-child{ border-right:0; }

.kb__rows{ padding:6px 3px 0; display:flex; flex-direction:column; gap:10px; }
.kb__row{ display:flex; gap:6px; justify-content:center; }

.kb__key{
  height:42px; flex:0 0 33px;
  border:0; border-radius:5px;
  background:#FFFFFF;
  box-shadow:0 1px 0 rgba(0,0,0,.30);
  font:400 22px/1 inherit; color:#000;
  display:grid; place-items:center; cursor:pointer; padding:0;
  -webkit-tap-highlight-color:transparent;
}
.kb__key:active{ background:#E4E5E9; }
.kb__key--mod{ background:#ACB3BD; flex:0 0 42px; }
.kb__key--mod:active{ background:#FFFFFF; }
.kb__key--wide{ flex:0 0 92px; font-size:16px; }
.kb__key--flex{ flex:1 1 auto; }
.kb__key--space{ flex:1 1 auto; font-size:16px; }
.kb__key--on{ background:#FFFFFF; }

.kb__bottom{
  height:44px; display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; color:#4A4A4A;
}
.kb__bottom button{ border:0; background:none; padding:0; color:inherit; cursor:default; display:grid; place-items:center; }

/* ---- Toast (prototype affordance for un-built destinations) ---- */
.toast{
  position:absolute; left:50%; bottom:212px; z-index:80;
  transform:translate(-50%,8px);
  max-width:300px;
  padding:12px var(--spacing-4);
  border-radius:12px;
  background:var(--surface-primary); color:var(--content-inverse);
  font-size:14px; line-height:20px; font-weight:500; text-align:center;
  opacity:0; pointer-events:none;
  transition:opacity .2s linear, transform .24s var(--ease);
}
.toast.is-on{ opacity:1; transform:translate(-50%,0); }

.home-indicator{
  position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
  width:140px; height:5px; border-radius:3px; background:var(--content-primary);
  z-index:90; pointer-events:none;
}
</style>
</head>

<script>
(() => {
  "use strict";

  /* ─────────────  DATA  ───────────── */
  /* First run: nobody has curated anything yet, so we seed five sensible
     defaults and offer a sixth "Add" slot. Ceiling is nine. */
  /* Cased to match the Bike action labels so these resolve to real art.
     "Miracle BLE reset" is the same action the designs called "MRE BLE reset". */
  const DEFAULT_FAVOURITES = [
    "commands", "bike status", "spare card", "warehouse tagging", "Miracle BLE reset"
  ];
  const MAX_FAVOURITES = 9;
  let favourites = [...DEFAULT_FAVOURITES];

  /* Chip glyphs. Inline rather than <img> so they inherit the chip's colour:
     the exported fill is #222222, which would vanish against the selected
     chip's #222222 ground. currentColor makes them white there instead.
     The exports wrap each path in a mask whose rect covers the whole 24 × 24

     and lets Favourites and search fall back to the unambiguous full name. */
  const LABEL = {

  /* Display-only text polish, applied at the last moment before a name is
     drawn. The stored strings are icon filenames and search keys, so they
     can't be corrected at the source — "IOT device info" has to keep matching
     IOT device info.png.

     Sentence case used to live in CSS as .tile__label::first-letter, but that
     pseudo-element doesn't apply to the -webkit-box the label needs for its
     two-line clamp. Chrome blockifies that box and honoured the rule anyway;
     iOS Safari doesn't, so every label rendered lowercase on device. */
  const SPELLING = [
    [/\bIOT\b/g,          "IoT"],
    [/\bE-\s+bike\b/gi,   "E-bike"],
    /* \binfo\b won't touch a name that already says "information". */
    [/\bdevice info\b/gi, "device information"],
    /* The icon file is "Miracle BLE reset"; the action is just "BLE reset". */
    [/\bMiracle BLE reset\b/g, "BLE reset"]
  ];
  function display(s) {
    const t = SPELLING.reduce((acc, [re, to]) => acc.replace(re, to), s);
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  function wrapped(name) {
    const head = WRAP_AFTER[name];
    return head && name.startsWith(head + " ")
      ? `${head}<br>${name.slice(head.length + 1)}`
      : name;
  }

  function artFor(label, variant) {
    const a = ART[label];
    if (!a) return null;
    const file = variant === "common" ? (a.common || a.tab) : (a.tab || a.common);
    return file ? encodeURI(ART_DIR + file) : null;
  }

    minus:`<span class="tile__badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 12h10"/></svg></span>`,
    plus: `<span class="tile__badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 7v10M7 12h10"/></svg></span>`
  };

  function tile(id, opts) {
    opts = opts || {};
    const b = document.createElement("button");
    b.className = "tile";
    b.type = "button";
    const src = artFor(id, opts.variant || "tab");
    const art = src
      ? `<img class="tile__art" src="${src}" alt="">`
      : `<span class="tile__ph">${EMPTY_ICON}</span>`;
    /* Inside a category tab the category is implied, so the short label reads
       better ("Status"). Out in Favourites there's no such context, so the
       action reverts to its full name ("Bike status") — same switch that
       takes the icon from its _tab art to its _common art. */
    const name = display(opts.variant === "common" ? id : labelOf(id));
    b.innerHTML =
      `<span class="tile__icon">${art}${opts.badge ? BADGE[opts.badge] : ""}</span>

  /* Search results carry no category context — the same reason Favourites
     shows full names and _common art. Two actions named "Status" side by side
     with their _tab icons are indistinguishable, so results use the full id. */
  function fillGrid(node, ids, onClick) {
    node.replaceChildren(...ids.map(id =>
      tile(id, { variant:"common", onClick: onClick ? () => onClick(id) : undefined })));
  }

  /* ── Favourites + edit mode ─────────────────────────────

     a −, catalogue actions get a +. The sheet never enters edit mode. */
  let editing = false;

  /* Pad a partial row out to three. 1,2,4,5,7,8 favourites leave a gap;

  function emptySlots() {
    return favourites.length === 0 ? 3 : (3 - favourites.length % 3) % 3;
  }

               stroke="currentColor" stroke-width="2" stroke-dasharray="8 8"/>

            stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
         <path d="M12 6v12M6 12h12"/>

    b.addEventListener("click", onClick);
    return b;
  }

  function renderFavourites() {
    const slots = emptySlots();

    /* From the sheet there's no edit affordance, so a slot takes you to the
       expanded page and opens edit mode there. */
    const sheetTiles = favourites.map(l => tile(l, { variant:"common" }));
    for (let i = 0; i < slots; i++) {
      sheetTiles.push(slot(() => { setView("expanded"); setEditing(true); }));
    }
    sheetGrid.replaceChildren(...sheetTiles);

    const favTiles = favourites.map(l => editing
      ? tile(l, { variant:"common", badge:"minus", onClick: () => removeFavourite(l) })
      : tile(l, { variant:"common" }));
    for (let i = 0; i < slots; i++) {
      favTiles.push(slot(() => setEditing(true)));
    }
    favGrid.replaceChildren(...favTiles);
    favGrid.classList.toggle("is-editing", editing);

    syncSheetTop();
  }

  /* The sheet's height follows its content, so its top edge moves. The expand
     animation starts from that edge, so publish it for #pageExpanded to read.
     Measured in device px — the whole prototype is drawn at a scale factor. */
  function syncSheetTop() {
    const h = sheet.getBoundingClientRect().height / deviceScale();
    /* Read the sheet's own bottom offset rather than repeating the nav height —
       move the sheet in CSS and the expand animation follows. */
    const bottom = parseFloat(getComputedStyle(sheet).bottom) || 0;
    device.style.setProperty("--sheet-top", Math.round(844 - bottom - h) + "px");
  }

     floating layer over the expanded page. Moving the node rather than cloning
     it keeps a single button, so the pill → field morph still measures the rect
     of whichever one is on screen. */
  function placeSearchFab(next) {
    if (next !== "sheet" && next !== "expanded") return;   /* hidden anyway */
    const host = next === "expanded" ? device : sheet;
    if (searchFab.parentNode === host) return;
    if (host === sheet) sheet.append(searchFab);
    else device.insertBefore(searchFab, bottomNav);
    syncSheetTop();                        /* the sheet just changed height */
    syncFabLanded();
  }

  /* At the end of the scroll there's nothing behind the pill: the scrim has
     nothing to fade out and the lift has nothing to lift off, so both come away
     and the pill reads as sitting on the bottom of the page. Only on the
     expanded page — in the sheet the pill is a plain row and stays as it is. */
  function syncFabLanded() {
    const floating = searchFab.parentNode === device;
    const atEnd = expandedScroll.scrollHeight - expandedScroll.clientHeight
                - expandedScroll.scrollTop <= 2;
    searchFab.classList.toggle("is-landed", floating && atEnd);
  }
  expandedScroll.addEventListener("scroll", syncFabLanded, { passive:true });

  function renderCat() {
    const full = favourites.length >= MAX_FAVOURITES;
    catGrid.replaceChildren(...CATEGORIES[activeCat].actions.map(l => {
      if (!editing) return tile(l);
      if (favourites.includes(l)) return tile(l, { onClick: () => toast(`${display(l)} is already a favourite`) });
      if (full) return tile(l, { onClick: () => toast(`Favourites are full — remove one first`) });
      return tile(l, { badge:"plus", onClick: () => addFavourite(l) });
    }));
    catGrid.classList.toggle("is-editing", editing);
    padCatGrid();
  }

  /* Give a short category exactly enough height that the scroll ends with the
     tab strip pinned — no less, so the strip can't slide back down when you
     switch to IoT from the bottom of Bike; and no more, or those one or two
     actions scroll up underneath the strip and get cut off.

     Everything is derived from #catGrid, never from the strip: offsetTop on a
     position:sticky element reports where it's currently *painted*, so reading
     it while the strip was pinned inflated the answer and the padding grew on
     every switch. #catGrid is statically positioned, so its offsetTop is its
     real place in the scroll content.

     Want: maxScroll === the strip's own offset, i.e.
       scrollHeight - port === gridTop - stripHeight
     and since scrollHeight === gridTop + gridHeight + tail, that reduces to
       gridHeight === port - stripHeight - tail.

     `tail` is read off the container's own padding rather than measured from
     scrollHeight: the grid is the container's last child, and scrollHeight
     bottoms out at clientHeight, so on a short category it reports the port
     height and makes the tail look bigger than it is. */
  function padCatGrid() {
    /* Dropping the padding to measure the natural height collapses the page,
       and the browser clamps scrollTop on the spot — restoring the height
       afterwards doesn't bring the scroll back. Put it back by hand. */
    const keep = expandedScroll.scrollTop;
    catGrid.style.minHeight = "0px";
    const port = 844 - pageHead.offsetHeight;
    const tail = parseFloat(getComputedStyle(expandedScroll).paddingBottom) || 0;
    const want = port - tabsWrap.offsetHeight - tail;
    if (want > catGrid.offsetHeight) catGrid.style.minHeight = Math.ceil(want) + "px";
    expandedScroll.scrollTop = keep;
    syncFabLanded();               /* the page just changed height */
  }

  function addFavourite(label) {
    if (favourites.includes(label)) { toast(`${display(label)} is already in favourites`); return; }
    if (favourites.length >= MAX_FAVOURITES) { toast("Favourites are full — remove one first"); return; }
    favourites.push(label);
    renderFavourites();
    renderCat();
    toast(`${display(label)} added to favourites`);
  }

  function removeFavourite(label) {
    favourites = favourites.filter(l => l !== label);
    renderFavourites();
    renderCat();

  function setEditing(on) {
    editing = on;
    closeMenu();
    $("expandedBar").classList.toggle("is-editing", on);
    $("expandedTitle").textContent = on ? "Edit favourites" : "Workbench";
    $("btnMenu").hidden = on;

  /* ── Kebab menu ─────────────────────────────────────────── */
  function menuOpen() { return !$("editMenu").hidden; }
  function closeMenu() {

    $("menuScrim").hidden = true;
    $("btnMenu").setAttribute("aria-expanded", "false");
  }
  function openMenu() {
    /* The bar scrolls, so the kebab isn't at a fixed spot — measure it. The
       menu lives at device level (above the nav, so the scrim covers the whole
       screen), which means its position has to be set rather than inherited. */
    const s = deviceScale();
    const k = btnMenu.getBoundingClientRect();
    const dev = device.getBoundingClientRect();
    const menu = $("editMenu");
    menu.style.top = Math.round((k.bottom - dev.top) / s + 4) + "px";

    const fallback = () => { img.hidden = true; coded.hidden = false; };
    img.addEventListener("error", fallback);
    if (img.complete && img.naturalWidth === 0) fallback();
  })();

  /* Tasks list behind the sheet (fallback only) */
  (function buildTasks() {
    const bolt = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>`;
    const rows = [
      ["5078909 • Miracle","42%"], ["5078910 • Miracle","67%"], ["5078911 • Dex NV","28%"],

  renderFavourites();

  /* Category tabs */
  let activeCat = 0;
  /* Every tab carries its icon, selected or not — the underline and the
     darker label carry the selected state on their own. */
  function renderTabs() {
    catTabs.replaceChildren(...CATEGORIES.map((c, i) => {
      const b = document.createElement("button");
      b.className = "tab";
      b.type = "button";
      b.setAttribute("aria-selected", String(i === activeCat));
      if (c.glyph) b.insertAdjacentHTML("beforeend", c.glyph);
      b.append(c.label);
      b.addEventListener("click", () => selectCat(i));
      return b;
    }));
  }

  /* Trailing fade tells you the tab row scrolls; drop it at the end. */
  (function tabScrollCue() {
    const wrap = $("tabsWrap");
    const sync = () => {
      const atEnd = catTabs.scrollLeft + catTabs.clientWidth >= catTabs.scrollWidth - 1;
      wrap.classList.toggle("at-end", atEnd);
    };
    catTabs.addEventListener("scroll", sync, { passive:true });
    window.addEventListener("resize", sync);
    sync();
  })();

  function selectCat(i) {
    /* Rebuilding the strip and the grid each momentarily shrink the page, and
       the browser clamps scrollTop on the spot. Hold the scroll across the
       whole swap, or picking a shorter category drops the sticky strip back
       down the screen. */
    const keep = expandedScroll.scrollTop;
    activeCat = i;
    renderTabs();
    renderCat();
    expandedScroll.scrollTop = keep;
    catTabs.children[i].scrollIntoView({ behavior:"smooth", block:"nearest", inline:"nearest" });
  }
  $("btnMenu").innerHTML = KEBAB_ICON;
  $("btnDone").innerHTML = DONE_TICK + "Done";
  $("miEditFavourites").innerHTML = EDIT_ICON + "Edit favourites";
  const btnMenu = $("btnMenu");
  btnMenu.addEventListener("click", e => { e.stopPropagation(); toggleMenu(); });
  /* The scrim swallows the tap that dismisses the menu — it never reaches the

  $("menuScrim").addEventListener("click", closeMenu);
  $("miEditFavourites").addEventListener("click", e => { e.stopPropagation(); setEditing(true); });
  $("btnDone").addEventListener("click", e => { e.stopPropagation(); setEditing(false); });

     mode when you're in it. "Away" means genuine background — anything that
     isn't a tile, an empty slot, or a control. */
  pageExpanded.addEventListener("click", e => {
    if (e.target.closest("#btnMenu, #editMenu")) return;
    if (menuOpen()) { closeMenu(); return; }
    if (!editing) return;
    if (e.target.closest(".tile, .slot, .appbar, .tabs-wrap, .searchfab")) return;
    setEditing(false);

  /* ─────────────  VIEW STATE  ───────────── */
  // 'tasks' | 'sheet' | 'expanded' | 'search'
  let view = "tasks";

  function setView(next) {
    view = next;

    /* The sheet stays mounted behind everything workbench-y so the expanded
       page has a continuous white surface to grow out of (and shrink back to). */
    const inWorkbench = next !== "tasks";
    scrim.classList.toggle("is-on",   inWorkbench);
    sheet.classList.toggle("is-open", inWorkbench);
    pageExpanded.classList.toggle("is-on",
      next === "expanded" || (next === "search" && searchOrigin === "expanded"));
    pageSearch.classList.toggle("is-on", next === "search");

    sheet.style.transform = "";                 // clear any drag offset
    sheet.classList.remove("is-dragging");

    searchFab.hidden = !(next === "sheet" || next === "expanded");
    placeSearchFab(next);
    /* Unconditional: placeSearchFab only re-measures when it actually moves the
       pill, so on a plain tasks → sheet trip --sheet-top would keep whatever
       value it had before the pill was in the sheet, and the expand animation
       would start 72px too low. */
    syncSheetTop();
    syncFabLanded();

    const activeNav = next === "tasks" ? "tasks" : "workbench";
    document.querySelectorAll(".navitem").forEach(n => {
      if (n.dataset.nav === activeNav) n.setAttribute("aria-current", "page");
      else n.removeAttribute("aria-current");
    });

    if (next === "expanded") expandedScroll.scrollTop = 0;
    /* Edit mode belongs to the expanded page — leaving it exits edit. */
    if (next !== "expanded" && next !== "search" && editing) setEditing(false);

    if (next === "search") {
      searchInput.value = "";
      renderSearch("");
      kbLayer = "letters"; kbShift = false;
      renderKeyboard();
      syncClear();
      setTimeout(() => searchInput.focus({ preventScroll:true }), 60);
    } else {
      searchInput.blur();
    }

  /* ─────────────  SHEET DRAG  ───────────── */
  let drag = null;

  function onDown(e) {
    if (view !== "sheet") return;
    // Don't capture the pointer when the press starts on the expand button —
    // capture would redirect the pointer events and swallow its click.
    if (e.target.closest("#btnExpand")) return;
    // Height is content-driven now, so the dismiss threshold is measured per
    // drag rather than taken off a constant.
    drag = { y:e.clientY, dy:0, h:sheet.getBoundingClientRect().height / deviceScale() };
    sheet.classList.add("is-dragging");
    sheetGrab.setPointerCapture(e.pointerId);

  function onMove(e) {
    if (!drag) return;
    drag.dy = (e.clientY - drag.y) / deviceScale();   /* screen px → device px */

    const offset = drag.dy < 0 ? Math.max(drag.dy, -140) * 0.55 : drag.dy;
    sheet.style.transform = `translateY(${offset}px)`;

    if (!drag) return;
    const dy = drag.dy, h = drag.h;
    drag = null;

    sheet.style.transform = "";
    try { sheetGrab.releasePointerCapture(e.pointerId); } catch {}

  sheetGrab.addEventListener("pointermove", onMove);
  sheetGrab.addEventListener("pointerup", onUp);
  sheetGrab.addEventListener("pointercancel", onUp);

  btnExpand.addEventListener("pointerdown", e => e.stopPropagation());

     element), the sheet must not stay stuck mid-drag. */
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);

  /* Drag down on the expanded page header → collapse back to the sheet */
  (function collapseDrag() {
    const head = pageExpanded.querySelector(".page__head");
    let start = null;
    head.addEventListener("pointerdown", e => { start = e.clientY; });
    head.addEventListener("pointerup", e => {
      if (start !== null && (e.clientY - start) / deviceScale() > 40) setView("sheet");
      start = null;
    });
    head.addEventListener("pointercancel", () => { start = null; });
  })();

  /* ─────────────  SEARCH  ───────────── */
  function renderSearch(q) {
    const term = q.trim().toLowerCase();

    if (!term) {
      searchLabel.textContent = "Recommended";
      searchLabel.hidden = false;
      fillGrid(searchGrid, CATALOGUE.slice(0, 6).map(a => a.id));
      searchGrid.hidden = false;
      removeEmpty();
      return;
    }
    /* Match the stored id and its displayed form, so both "e- bike" and the
       "E-bike" people actually see on screen find the same action. */
    const hits = CATALOGUE.filter(a =>
      a.id.toLowerCase().includes(term) ||
      display(a.id).toLowerCase().includes(term)).slice(0, 12);
    removeEmpty();
    if (!hits.length) {
      searchLabel.hidden = true;
      searchGrid.hidden = true;
      const p = document.createElement("p");
      p.className = "search__empty";
      p.id = "searchEmpty";
      p.textContent = `No actions match “${q.trim()}”`;
      searchResults.append(p);
      return;
    }
    searchLabel.hidden = false;
    searchLabel.textContent = `${hits.length} result${hits.length > 1 ? "s" : ""}`;
    searchGrid.hidden = false;
    fillGrid(searchGrid, hits.map(h => h.id));
  }
  function removeEmpty() {
    const e = document.getElementById("searchEmpty");
    if (e) e.remove();
  }

  /* ─────────────  iOS KEYBOARD  ───────────── */
  const K = {
    ch:   c => ({ type:"char", label:c }),
    key:  (type, label, cls) => ({ type, label, cls })
  };
  const KB_LAYERS = {
    letters: [
      "qwertyuiop".split("").map(K.ch),
      "asdfghjkl".split("").map(K.ch),
      [K.key("shift","","mod"), ..."zxcvbnm".split("").map(K.ch), K.key("back","","mod")],
      [K.key("layer","123","mod wide"), K.key("space","space","space"), K.key("return","return","mod wide")]
    ],
    numbers: [
      "1234567890".split("").map(K.ch),
      ["-","/",":",";","(",")","$","&","@","\""].map(K.ch),
      [K.key("layer","#+=","mod flex"), ...[".",",","?","!","'"].map(c => ({ ...K.ch(c), cls:"flex" })), K.key("back","","mod flex")],
      [K.key("layer","ABC","mod wide"), K.key("space","space","space"), K.key("return","return","mod wide")]
    ],
    symbols: [
      ["[","]","{","}","#","%","^","*","+","="].map(K.ch),
      ["_","\\","|","~","<",">","€","£","¥","•"].map(K.ch),
      [K.key("layer","123","mod flex"), ...[".",",","?","!","'"].map(c => ({ ...K.ch(c), cls:"flex" })), K.key("back","","mod flex")],
      [K.key("layer","ABC","mod wide"), K.key("space","space","space"), K.key("return","return","mod wide")]
    ]
  };
  const LAYER_FOR = { "123":"numbers", "ABC":"letters", "#+=":"symbols" };

  const ICON_SHIFT = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.4 3.6 12H8v6.4h8V12h4.4L12 3.4Z"/></svg>`;
  const ICON_BACK  = `<svg width="24" height="20" viewBox="0 0 28 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 2h15a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H9L2 11 9 2Z" fill="currentColor" stroke="none" opacity=".92"/><path d="m12.5 7.5 7 7m0-7-7 7" stroke="#fff"/></svg>`;

  const kbRows = $("kbRows");
  let kbLayer = "letters";
  let kbShift = false;

  function renderKeyboard() {
    const rows = KB_LAYERS[kbLayer];
    kbRows.replaceChildren(...rows.map(row => {
      const r = document.createElement("div");
      r.className = "kb__row";
      row.forEach(spec => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "kb__key" + (spec.cls ? " " + spec.cls.split(" ").map(c => "kb__key--" + c).join(" ") : "");
        if (spec.type === "shift") {
          b.innerHTML = ICON_SHIFT;
          b.classList.toggle("kb__key--on", kbShift);
          b.setAttribute("aria-label", "Shift");
        } else if (spec.type === "back") {
          b.innerHTML = ICON_BACK;
          b.setAttribute("aria-label", "Backspace");
        } else if (spec.type === "char") {
          b.textContent = (kbShift && kbLayer === "letters") ? spec.label.toUpperCase() : spec.label;
        } else {
          b.textContent = spec.label;
        }
        b.addEventListener("click", () => pressKey(spec));
        r.append(b);
      });
      return r;
    }));
  }

  function pressKey(spec) {
    switch (spec.type) {
      case "char":
        insert((kbShift && kbLayer === "letters") ? spec.label.toUpperCase() : spec.label);
        if (kbShift) { kbShift = false; renderKeyboard(); }
        break;
      case "space":  insert(" "); break;
      case "back":
        searchInput.value = searchInput.value.slice(0, -1);
        afterEdit();
        break;
      case "shift":
        kbShift = !kbShift; renderKeyboard();
        break;
      case "layer":
        kbLayer = LAYER_FOR[spec.label]; kbShift = false; renderKeyboard();
        break;
      case "return":
        break;                                  /* results are already live */
    }
  }

  function insert(ch) {
    searchInput.value += ch;
    afterEdit();
  }
  function afterEdit() {
    renderSearch(searchInput.value);
    syncClear();
  }
  function syncClear() {
    searchClear.classList.toggle("is-on", searchInput.value.length > 0);
  }

  renderKeyboard();
  $("kbDone").addEventListener("click", () => closeSearch(searchExit()));

  searchClear.addEventListener("click", () => {
    searchInput.value = "";
    afterEdit();
  });

  searchInput.addEventListener("input", () => { renderSearch(searchInput.value); syncClear(); });

  /* Where search was opened from — 'sheet' or 'expanded'. */
  let searchOrigin = "sheet";

  /* Closing search always returns you at least as far as you came from:
     opened from the full page  → back to the full page, typed or not.
     opened from the sheet      → the full page if a query was typed,
                                  otherwise back to the sheet. */
  /* Search always lets you out onto the full page, never back into the sheet.
     Coming out of a search you're looking for something, and the sheet only
     holds nine favourites — landing there hides the very catalogue you were
     searching. */
  function searchExit() { return "expanded"; }
  searchClose.addEventListener("click", () => closeSearch(searchExit()));
  /* ─────────────  PILL → FIELD MORPH  ─────────────
     The floating Search pill and the search field are the same surface. On
     open the field is planted on the pill's exact rect, then released to its
     own geometry so it grows and travels up in one move; the keyboard rides
     up underneath. On close the move runs backwards. */
  const searchBar   = document.querySelector(".search__bar");
  const searchField = document.querySelector(".search__field");
  let collapsedGeom = null;                    /* pill rect, bar-local */
  let closing = false;

  /* Keep the JS timing tied to the CSS variable — one source of truth. */
  const MORPH_MS = (parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue("--morph")) || 0.34) * 1000;

  /* The device is CSS-scaled to fit the window, so client rects come back in
     scaled pixels while inline geometry is written in the device's own 390×844
     space. Everything measured off a rect must be divided by this. */
  /* Declared, not assigned to a const: syncSheetTop() needs it during the very
     first render, which runs earlier in this file. */
  function deviceScale() { return device.getBoundingClientRect().width / 390; }

  function applyGeom(g) {
    searchField.style.left   = g.left   + "px";
    searchField.style.top    = g.top    + "px";
    searchField.style.width  = g.width  + "px";
    searchField.style.height = g.height + "px";
  }
  function clearGeom() {
    searchField.style.left = searchField.style.top =
    searchField.style.width = searchField.style.height = "";
  }

  /* Where the pill will sit once we're on `dest`, in the search bar's frame.
     The pill is hidden during search, so it's parked in its destination host
     and measured with visibility:hidden — that still lays out, unlike hidden,
     which would measure 0. */
  function pillGeom(dest) {
    placeSearchFab(dest);
    const wasHidden = searchFab.hidden;
    searchFab.style.visibility = "hidden";
    searchFab.hidden = false;
    const pill = btnSearch.getBoundingClientRect();
    const bar  = searchBar.getBoundingClientRect();
    searchFab.hidden = wasHidden;
    searchFab.style.visibility = "";
    if (!pill.width) return null;
    const s = deviceScale();
    return {
      left:   Math.round((pill.left - bar.left) / s),
      top:    Math.round((pill.top  - bar.top)  / s),
      width:  Math.round(pill.width  / s),
      height: Math.round(pill.height / s)
    };
  }

  function openSearch(source) {
    if (closing) return;
    const pill = source.getBoundingClientRect();
    searchOrigin = view === "expanded" ? "expanded" : "sheet";
    setView("search");                          /* page mounts, FAB hides */

    const bar = searchBar.getBoundingClientRect();
    const s = deviceScale();
    collapsedGeom = {
      left:   Math.round((pill.left - bar.left) / s),
      top:    Math.round((pill.top  - bar.top)  / s),
      width:  Math.round(pill.width  / s),
      height: Math.round(pill.height / s)
    };

    searchField.classList.add("is-morphing");
    pageSearch.classList.add("is-opening");
    searchField.style.transition = "none";      /* plant it on the pill … */
    applyGeom(collapsedGeom);
    void searchField.offsetHeight;              /* … commit that frame … */
    searchField.style.transition = "";          /* … then let it grow */
    clearGeom();
    pageSearch.classList.remove("is-opening");  /* background/content fade in */
    setTimeout(() => searchField.classList.remove("is-morphing"), MORPH_MS);
  }
  btnSearch.addEventListener("click", () => openSearch(btnSearch));

  function closeSearch(dest) {
    if (closing) return;                        /* ignore repeat taps */
    closing = true;
    searchInput.blur();

    /* Grow the expanded page DURING the morph, not after it. Search always
       exits onto that page now, and when search was opened from the sheet the
       page is still sheet-sized — left to setView it starts growing only once
       the search page has gone, so you sit through 340ms of morph and then
       another 420ms of the page climbing. Overlapped, it's one move; the
       closing search page is transparent, so it shows through. */
    if (dest === "expanded") pageExpanded.classList.add("is-on");

    searchField.classList.add("is-morphing");
    /* Morph onto where the pill will BE, not where it was when search opened.
       Opening from the sheet captures the in-sheet pill; we always land on the
       expanded page now, where it floats 8px lower. */
    const target = pillGeom(dest) || collapsedGeom;
    if (target) applyGeom(target);
    pageSearch.classList.add("is-closing");

    /* Let the morph finish before swapping views. Cutting it short is what
       made this feel laggy: the field snapped back to full width while the
       page was still on screen. */
    setTimeout(() => {
      setView(dest);
      pageSearch.classList.remove("is-closing");
      searchField.classList.remove("is-morphing");
      clearGeom();
      closing = false;
    }, MORPH_MS);
  }
  btnExpand.addEventListener("click", () => setView("expanded"));

  /* ─────────────  NAV  ───────────── */
  bottomNav.addEventListener("click", e => {
    const btn = e.target.closest(".navitem");
    if (!btn) return;
    const dest = btn.dataset.nav;
    if (dest === "workbench") setView(view === "tasks" ? "sheet" : "tasks");
    else if (dest === "tasks") setView("tasks");
    else toast(`${btn.textContent.trim()} — not in this flow`);
  });

  scrim.addEventListener("click", () => setView("tasks"));

  /* ─────────────  TOAST  ───────────── */
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("is-on"), 1600);
  }
  device.addEventListener("click", e => {
    const t = e.target.closest("[data-toast]");
    if (t) toast(t.dataset.toast);
  });

  /* ─────────────  KEYS  ───────────── */
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (view === "search") closeSearch(searchExit());
    else if (view === "expanded") setView("sheet");
    else if (view === "sheet") setView("tasks");
  });

  /* ─────────────  FIT TO WINDOW  ─────────────
     Scale the 390×844 screen to fill the window, keeping its aspect so nothing
     is clipped or stretched. Never scales past 1:1. Below 800px the screen runs
     edge to edge; above it, room is left for the case ring and its shadow —
     the same breakpoint the stylesheet uses to draw them. */
  function fitDevice() {
    /* 4px on a phone leaves room for the 2px stroke on each side — an outline
       draws outside its box, so a screen that filled the window exactly would
       push its own stroke off-screen. */
    const room = window.innerWidth >= 800 ? 48 : 4;
    const byHeight = (window.innerHeight - room) / 844;
    const byWidth  = (window.innerWidth  - room) / 390;
    const scale = Math.max(0.3, Math.min(1, byHeight, byWidth));
    document.documentElement.style.setProperty("--scale", scale.toFixed(4));
    syncSheetTop();                          /* rects just changed size */
  }
  window.addEventListener("resize", fitDevice);
  window.addEventListener("orientationchange", fitDevice);
  /* Mobile browsers settle their viewport after first paint — re-measure once
     everything has loaded, or the first scale can be a few pixels stale. */
  window.addEventListener("load", fitDevice);
  fitDevice();

  /* boot */
  setView("tasks");
})();
</script>
</body>
</html>
